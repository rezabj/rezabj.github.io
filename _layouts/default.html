<!doctype html>
<html lang="{{ site.lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.layout == "home" %}{{ site.title | escape }} — {{ site.description | escape }}{% else %}{{ page.title | escape }} — {{ site.title | escape }}{% endif %}</title>
  <meta name="description" content="{{ page.description | default: site.description | strip_html | escape }}">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <link rel="icon" href="/assets/images/2023/08/powershelllogo-150x150.png">
  <link rel="apple-touch-icon" href="/assets/images/2023/08/powershelllogo.png">
  <link rel="alternate" type="application/rss+xml" title="{{ site.title | escape }} Feed" href="/feed/index.xml">
  {% include styles.html %}
  <script src="/assets/site.js?v={{ site.time | date: '%s' }}" defer></script>
</head>
<body class="wp-custom-logo wp-embed-responsive wp-theme-twentytwentytwo {% if page.layout == 'home' %}home blog{% endif %}">
  <a class="skip-link screen-reader-text" href="#wp--skip-link--target">Skip to content</a>
  <div class="wp-site-blocks">
    {% include header.html %}
    {{ content }}
    {% include footer.html %}
  </div>
</body>
</html>
