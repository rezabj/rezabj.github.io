title: www.rezab.eu
description: Microsoft 365, Intune, PowerShell, Modern Desktop Management
author: Jan Řežab
url: https://rezab.eu
baseurl: ""
lang: en-US
timezone: Europe/Prague
encoding: utf-8
markdown: kramdown
highlighter: rouge
permalink: /:categories/:year/:month/:day/:title/
destination: _site
kramdown:
  input: GFM
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    block:
      line_numbers: false
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      author: Jan Řežab
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - Dockerfile
  - compose.yaml
  - docker
  - scripts
  - content
  - docs
  - _legacy
  - vendor
  - node_modules
  - assets/main.scss
  - assets/index.markdown
  - assets/img/index.markdown
