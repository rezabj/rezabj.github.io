server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    location / { try_files $uri $uri/ =404; }
    location = /feed/ { default_type application/rss+xml; try_files /feed/index.xml =404; }
    error_page 404 /404.html;
    location = /404.html { internal; }
}
